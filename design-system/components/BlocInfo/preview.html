<!doctype html>
<html lang="fr" data-theme="clair">
<head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<meta charset="utf-8">
<title>Bloc d'infos</title>
<style>
  .scene { padding: 24px 32px; background: var(--fond); }
  .cie-infos { width: 520px; transform: scale(.8); transform-origin: 0 0; }
</style>
</head>
<body style="margin:0">
<div class="scene">
  <div class="cie-infos">
    <div class="cie-info">
      <span class="cie-info-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
      <span class="cie-info-texte"><b>Sam. 18 oct. 2026</b><small>09h00 à 12h00</small></span>
    </div>
    <div class="cie-info">
      <span class="cie-info-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
      <span class="cie-info-texte"><b>Salle info, EPO</b><small>Campus de l'École Polytechnique de Ouagadougou</small></span>
    </div>
    <div class="cie-info">
      <span class="cie-info-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <span class="cie-info-texte"><b>En ligne aussi</b><small>Lien Google Meet envoyé la veille</small></span>
    </div>
  </div>
</div>
</body>
</html>
