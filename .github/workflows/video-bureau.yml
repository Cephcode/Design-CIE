name: Vidéo du bureau

# Refait la vidéo à chaque modification de bureau/ (textes, photos, musique),
# ou à la demande depuis l'onglet Actions (bouton « Run workflow »).
on:
  push:
    branches: [main]
    paths:
      - "bureau/**"
  workflow_dispatch:

concurrency:
  group: video-bureau
  cancel-in-progress: true

jobs:
  rendu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer ffmpeg, Playwright et Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Vérifier contenu.json
        run: python -c "import json; json.load(open('bureau/contenu.json')); print('contenu.json valide')"

      - name: Rendre la vidéo
        working-directory: bureau
        run: python render.py --travailleurs 4

      - name: Publier les vidéos
        uses: actions/upload-artifact@v4
        with:
          name: video-bureau
          path: |
            bureau/sortie/bureau-cie.mp4
            bureau/sortie/bureau-cie-whatsapp.mp4
          retention-days: 30
